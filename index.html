<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ping Pong Duel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Ping Pong Duel</h1>
          <p>Left player: W/S. Right player: ↑/↓. Toggle AI for solo play.</p>
        </div>
        <div class="controls">
          <button id="toggle-ai" type="button">Enable AI Opponent</button>
          <button id="reset" type="button">Reset Round</button>
        </div>
      </header>

      <section class="game">
        <canvas id="game-canvas" width="900" height="500"></canvas>
        <div class="scoreboard">
          <div class="score">
            <span class="label">Blue</span>
            <span id="score-left" class="value">0</span>
          </div>
          <div class="score">
            <span class="label">Green</span>
            <span id="score-right" class="value">0</span>
          </div>
        </div>
        <div id="status" class="status" role="status">Serve the ball with Space.</div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
